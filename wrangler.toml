name               = "duplicate-order-checker-worker"   # لازم يطابق اسم الـ Worker في الداشبورد بالحرف
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true

[observability]
enabled = true

[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ══════════════════════════════════════════════════════════════
# 🔴 اقرا ده قبل ما تربط الريبو بـ Workers Builds — مرة واحدة
# ══════════════════════════════════════════════════════════════
# أول ما الـ Worker يتربط بالريبو، الـ [vars] اللي تحت **بتحلّ محل** اللي
# في الداشبورد بالكامل. أي var موجود في الداشبورد ومش مكتوب هنا **بيتمسح**
# من غير أي رسالة — والكود بيقع على الـ fallback بتاعه وبيكمّل شغل عادي.
#
# الأداة دي عندها في الداشبورد دلوقتي **تلات vars**:
#   SHOP_DOMAIN            ← مكتوب تحت ✅
#   DUPLICATE_TAG          ← مكتوب تحت ✅
#   DUPLICATE_NOTE_PREFIX  ← 🔴 **ناقص عن قصد** — اقرا تحت
#
# `DUPLICATE_NOTE_PREFIX` قيمته نص عربي، وما اتكتبش هنا لأنه **ما اتقريش من
# مصدر موثوق** (الـ MCP مابيرجّعش قيم الـ vars، واللقطة مش مصدر يتنسخ منه
# نص عربي بالحرف). لو الريبو اتربط وهو ناقص:
#   الكود هيقع على الـ fallback في index.js → `'Possible duplicate orders'`
#   يعني **النوت اللي بيتكتب على أوردرات حقيقية هيتغيّر من العربي للإنجليزي**،
#   والأداة مش هتشتكي.
#
# الإجراء المطلوب **قبل** الربط:
#   1. Cloudflare → duplicate-order-checker-worker → Settings → Variables
#   2. انسخ قيمة DUPLICATE_NOTE_PREFIX بالحرف (Edit → نسخ من الحقل نفسه)
#   3. شيل علامة التعليق من السطر تحت والزق القيمة مكان <القيمة الحالية>
#   4. commit + push، وبعدين اربط الريبو
# ══════════════════════════════════════════════════════════════

[vars]
SHOP_DOMAIN   = "6c7e1a-53.myshopify.com"
DUPLICATE_TAG = "Duplicate"
# DUPLICATE_NOTE_PREFIX = "<القيمة الحالية من الداشبورد — انسخها بالحرف قبل أول build>"

# ── Secrets (Dashboard فقط، وبعد أي إضافة → Promote) ──
#   WORKER_SECRET · CLIENT_ID · CLIENT_SECRET · SHOPIFY_WEBHOOK_SECRET
